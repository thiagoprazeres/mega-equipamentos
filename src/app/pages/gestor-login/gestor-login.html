<section class="grid min-h-screen place-items-center bg-base-200 px-4 py-10">
  <div class="w-full max-w-sm rounded-lg border border-base-300 bg-base-100 p-6 shadow-lg">
    <div class="text-center">
      <img
        class="mx-auto h-14 w-auto"
        src="logo-mega-equipamentos-preto.png"
        alt="Mega Equipamentos"
      />
      <h1 class="mt-6 text-2xl font-extrabold text-primary">Área restrita</h1>
      <p class="mt-2 text-sm text-base-content/60">Entre com uma conta Google autorizada.</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error mt-5 text-sm">{{ errorMessage }}</div>
    }

    <button
      class="btn mt-6 w-full border-base-300 bg-base-100 text-base-content hover:bg-base-200"
      type="button"
      (click)="signInWithGoogle()"
      [disabled]="loading"
    >
      @if (loading) {
        <span class="loading loading-spinner loading-sm"></span>
      } @else {
        <span class="grid h-5 w-5 place-items-center rounded-full border border-base-300 text-xs font-bold">
          G
        </span>
      }
      Entrar com Google
    </button>
  </div>
</section>
