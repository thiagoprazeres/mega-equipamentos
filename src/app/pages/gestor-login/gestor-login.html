<section class="grid min-h-screen place-items-center bg-base-200 px-4 py-10">
  <div class="w-full max-w-sm rounded-lg border border-base-300 bg-base-100 p-6 shadow-lg">
    <div class="text-center">
      <img
        class="mx-auto h-14 w-auto"
        src="logo-mega-equipamentos-preto.png"
        alt="Mega Equipamentos"
      />
      <h1 class="mt-6 text-2xl font-extrabold text-primary">Área restrita</h1>
      <p class="mt-2 text-sm text-base-content/60">Entre com uma conta Google autorizada.</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error mt-5 text-sm">{{ errorMessage }}</div>
    }

    <button
      class="btn mt-6 w-full border-base-300 bg-base-100 text-base-content hover:bg-base-200"
      type="button"
      (click)="signInWithGoogle()"
      [disabled]="loading"
    >
      @if (loading) {
        <span class="loading loading-spinner loading-sm"></span>
      } @else {
        <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
          <path
            fill="#FFC107"
            d="M43.61 20.08H42V20H24v8h11.3c-1.65 4.66-6.08 8-11.3 8-6.63 0-12-5.37-12-12s5.37-12 12-12c3.06 0 5.84 1.15 7.95 3.05l5.66-5.66C34.05 6.05 29.27 4 24 4 12.95 4 4 12.95 4 24s8.95 20 20 20 20-8.95 20-20c0-1.34-.14-2.65-.39-3.92Z"
          />
          <path
            fill="#FF3D00"
            d="m6.31 14.69 6.57 4.82C14.66 15.1 18.96 12 24 12c3.06 0 5.84 1.15 7.95 3.05l5.66-5.66C34.05 6.05 29.27 4 24 4 16.32 4 9.66 8.34 6.31 14.69Z"
          />
          <path
            fill="#4CAF50"
            d="M24 44c5.17 0 9.86-1.98 13.4-5.19l-6.19-5.24C29.14 35.14 26.54 36 24 36c-5.2 0-9.61-3.32-11.28-7.95l-6.53 5.03C9.5 39.55 16.22 44 24 44Z"
          />
          <path
            fill="#1976D2"
            d="M43.61 20.08H42V20H24v8h11.3c-.79 2.22-2.21 4.14-4.1 5.57l.01-.01 6.19 5.24C37.96 38.3 44 33.5 44 24c0-1.34-.14-2.65-.39-3.92Z"
          />
        </svg>
      }
      Entrar com Google
    </button>
  </div>
</section>
