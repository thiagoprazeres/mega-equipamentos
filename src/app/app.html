@if (!isRestrictedArea()) {
  <app-header></app-header>
}

@if (isRestrictedArea()) {
  <header
    class="border-b border-white/10 bg-neutral px-4 py-3 text-neutral-content"
    data-testid="restricted-header"
  >
    <div class="mx-auto flex max-w-7xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex items-center gap-3">
        <div class="grid h-11 w-11 shrink-0 place-items-center rounded-lg bg-primary text-base font-black text-primary-content">
          ME
        </div>
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.2em] text-neutral-content/55">Área gestora</p>
          <p class="text-lg font-extrabold leading-tight">Mega Equipamentos</p>
        </div>
      </div>

      <div class="flex flex-wrap gap-2">
        <a
          class="btn btn-ghost btn-sm gap-2 text-neutral-content/80 hover:bg-white/10 hover:text-neutral-content"
          routerLink="/gestor/equipamentos"
        >
          <lucide-angular [img]="LayoutDashboard" class="h-4 w-4"></lucide-angular>
          Painel
        </a>
        <a
          class="btn btn-ghost btn-sm gap-2 text-neutral-content/80 hover:bg-white/10 hover:text-neutral-content"
          routerLink="/"
        >
          <lucide-angular [img]="ArrowLeft" class="h-4 w-4"></lucide-angular>
          Site
        </a>
      </div>
    </div>
  </header>
}

<main
  [class]="isRestrictedArea() ? 'min-h-[calc(100vh-8.5rem)] bg-base-200 text-base-content' : ''"
>
  <router-outlet></router-outlet>
</main>

@if (isRestrictedArea()) {
  <footer
    class="border-t border-white/10 bg-neutral px-4 py-4 text-neutral-content"
    data-testid="restricted-footer"
  >
    <div class="mx-auto flex max-w-7xl flex-col gap-2 text-sm text-neutral-content/65 sm:flex-row sm:items-center sm:justify-between">
      <p class="font-semibold text-neutral-content">Mega Equipamentos · Área gestora</p>
      <p class="inline-flex items-center gap-2">
        <lucide-angular [img]="ShieldCheck" class="h-4 w-4 text-primary"></lucide-angular>
        Uso interno
      </p>
    </div>
  </footer>
}

@if (!isRestrictedArea()) {
  <app-footer></app-footer>
  <app-whats-app-button></app-whats-app-button>
}
