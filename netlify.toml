[build]
  command = "npm run build"
  publish = "dist/mega-equipamentos/browser"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/runtime-secrets/**"]

[[redirects]]
  from = "/area-restrita"
  to = "/index.csr.html"
  status = 200
  force = true

[[redirects]]
  from = "/gestor/*"
  to = "/index.csr.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/gestor/*"
  to = "/.netlify/functions/gestor-api/:splat"
  status = 200
  force = true

[dev]
  command = "npm start"
  targetPort = 4200
  port = 8888
