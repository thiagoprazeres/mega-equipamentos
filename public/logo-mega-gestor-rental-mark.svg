<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradient definition matching the application theme -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" /> <!-- sky-500 -->
      <stop offset="50%" stop-color="#06b6d4" /> <!-- cyan-500 -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- blue-500 -->
    </linearGradient>
    <linearGradient id="accent-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" /> <!-- sky-100 -->
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring / Shield (Industrial & Gestor theme) -->
  <rect 
    x="8" 
    y="8" 
    width="84" 
    height="84" 
    rx="22" 
    fill="#04101f" 
    stroke="url(#logo-grad)" 
    stroke-width="4"
    filter="url(#shadow)"
  />

  <!-- Stylized M & G Industrial / Rental Concept -->
  <!-- The shape represents structural scaffolding, a lifting hook, and the letters M + G -->
  
  <!-- Background structural gear detail (subtle) -->
  <circle cx="50" cy="50" r="30" stroke="url(#logo-grad)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />

  <!-- The "M" & "G" main mark -->
  <!-- Group with glow -->
  <g filter="url(#shadow)">
    <!-- Left Pillar of M -->
    <path 
      d="M28 32 V68 C28 70.2 29.8 72 32 72 H36 C38.2 72 40 70.2 40 68 V46 L50 58 L60 46 V52 C60 54.2 61.8 56 64 56 H72 C74.2 56 76 54.2 76 52 V32 C76 29.8 74.2 28 72 28 H68 C65.8 28 64 29.8 64 32 V36 L50 22 L36 36 V32 C36 29.8 34.2 28 32 28 H28 C25.8 28 28 29.8 28 32 Z" 
      fill="url(#logo-grad)" 
    />
    
    <!-- G loop (Lifting / Rental Hook curve at the bottom right) -->
    <path 
      d="M52 62 H68 C70.2 62 72 63.8 72 66 V68 C72 70.2 70.2 72 68 72 H52 C45.4 72 40 66.6 40 60 V56 H48 V60 C48 61.1 48.9 62 50 62 Z" 
      fill="url(#accent-grad)" 
    />

    <!-- Small active dynamic element inside the center -->
    <polygon points="50,42 55,50 45,50" fill="#ffffff" />
  </g>
</svg>
